<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mythoria — Jeu de cartes à collectionner</title>
  <meta name="description" content="Mythoria : ouvrez des boosters, remplissez votre grimoire et composez votre deck dark fantasy.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cinzel+Decorative:wght@700&family=Crimson+Pro:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <style type="text/tailwindcss">
    @theme {
      --color-bg: #0b0a10;
      --color-bg-alt: #0f0d16;
      --color-panel: #15121d;
      --color-line: #2a2437;
      --color-gold: #c9a24b;
      --color-gold-hi: #e8c76a;
      --color-violet: #7b3fe4;
      --color-text: #e8e2d0;
      --color-muted: #a89f8a;
      --font-title: "Cinzel", serif;
      --font-logo: "Cinzel Decorative", serif;
      --font-body: "Crimson Pro", serif;
      --animate-tourne: tourne 0.45s ease-out;
      @keyframes tourne {
        from { opacity:0; transform: perspective(900px) rotateY(-14deg) scale(0.98); }
        to { opacity: 1; transform: none; }
      }
    }
  </style>
</head>

<body class="bg-bg text-text font-body text-lg leading-normal">

  <header class="relative flex flex-wrap items-center justify-between gap-6 min-h-18 px-4 md:px-16 border-b border-line">
    <a href="index.html" class="font-logo text-2xl tracking-[.12em] text-gold hover:text-gold-hi">MYTHORIA</a>

    <nav id="main-nav" aria-label="Navigation principale" class="flex flex-wrap gap-x-9 gap-y-0">
      <a href="index.html" class="font-title text-[.85rem] uppercase tracking-[.14em] py-3 text-[#cfc8b4] hover:text-gold-hi">Accueil</a>
      <a href="shop.html" class="font-title text-[.85rem] uppercase tracking-[.14em] py-3 text-[#cfc8b4] hover:text-gold-hi">Boutique</a>
      <a href="opening.html" class="font-title text-[.85rem] uppercase tracking-[.14em] py-3 text-[#cfc8b4] hover:text-gold-hi">Ouverture</a>
      <a href="grimoire.html" aria-current="page" class="font-title text-[.85rem] uppercase tracking-[.14em] py-3 text-gold-hi">Grimoire</a>
      <a href="deck.html" class="font-title text-[.85rem] uppercase tracking-[.14em] py-3 text-[#cfc8b4] hover:text-gold-hi">Deck</a>
    </nav>

    <a href="shop.html" class="flex items-center gap-2 min-h-11 font-title text-[.85rem] text-gold hover:text-gold-hi">
      Panier
      <span id="cart-count" class="bg-gold text-bg rounded-xl px-2.5 py-0.5 font-bold">0</span>
      <span id="cart-total">0 dh</span>
    </a>
  </header>
  <main class="px-4 md:px-16 py-12">
    <section class="p-6 bg-panel">
        <h1 class="font-bold text-gold tracking-[.3em] text-[2.4rem] text-center">MON GRIMOIRE</h1>
        <p id="compteur" class="italic text-center text-[1.3rem] mb-8 text-muted"></p>
        <div class="flex flex-wrap justify-center gap-6 mb-8">
            <label class="flex items-center gap-3 font-title text-[.85rem] uppercase tracking-[.14em]">
                type
                <select id="filtre-type" class="bg-bg-alt border border-gold text-text p-2 rounded-xs font-body text-lg normal-case tracking-normal">
                    <option value="tous">Tous les types</option>
                    <option value="lumiere">Serviteurs de la lumieres (heros)</option>
                    <option value="tenebres">Serviteurs des Tenebres (monstres)</option>
                    <option value="minion">Minions (serviteurs)</option>
                    <option value="spell">Spells (sorts)</option> 
                </select>
            </label>
            <label class="flex items-center gap-3 font-title text-[.85rem] uppercase tracking-[.14em]">
                rareté
                <select id="filtre-rarete" class="bg-bg-alt border border-gold text-text p-2 rounded-xs font-body text-lg normal-case tracking-normal">
                    <option value="toutes">Tous les raretés</option>
                    <option value="commune">Commune</option>
                    <option value="rare">Rare</option>
                    <option value="epique">Epique</option>
                    <option value="legendaire">Légendaire</option> 
                </select>
            </label>    
        </div>
        <div id="vide-total" hidden class="text-center py-16">
            <p class="text-6xl mb-4">📖</p>
            <p class="font-title font-bold text-gold text-2xl tracking-widest mb-2">Votre grimoire est vide.</p>
            <p class="italic text-muted mb-8">Aucune carte collecté pour l'instant. Achetez un booster et ouvrez-le pour remplir vos pages.</p>
            <div class="flex flex-wrap justify-center gap-4">
                <a href="shop.html" class="min-h-12 px-7 py-3.5 font-title font-bold text-[.95rem] tracking-widest rounded-xs bg-gold text-bg transition hover:bg-gold-hi">Aller a la boutique</a>
                <a href="opening.html" class="min-h-12 px-7 py-3.5 font-title font-bold text-[.95rem] tracking-widest rounded-xs border border-gold text-gold transition hover:bg-gold hover:text-bg">Ouvrir mes boosters</a>
            </div>
        </div>
        <div id="livre" class="mx-auto max-w-5xl">
            <div class="rounded-xl border-4 border-[#5a3a1e] bg-[#2b1a10] p-3 md:p-5 shadow-[0_0_50px_rgba(0,0,0,.7)]">
                <div id="pages" class="animate-tourne motion-reduce:animate-none flex flex-col md:flex-row overflow-hidden rounded-md">
                    <div id="page-gauche" class="flex flex-col flex-1 min-h-[26rem] p-5 bg-[#d9c7a0] text-[#2b1d0e]"></div>
                    <div class="hidden md:block w-5 bg-linear-to-r from-[#b8a47a] via-[#3a2412] to-[#b8a47a]"></div>
                    <div id="page-droite" class="flex flex-col flex-1 min-h-[26rem] p-5 bg-[#d9c7a0] text-[#2b1d0e]"></div>
                </div>
            </div>
            <div class="flex items-center justify-between gap-4 mt-6">
                <button id="precedent" class="min-h-12 px-5 font-title font-bold text-[.85rem] tracking-widest rounded-xs border border-goldtext-gold transition hover:text-bg disabled:opacity-40 disabled:cursor-not-allowed">◀ Precedent</button>
                <span id="indicateur" class="font-title text-[.85rem] tracking-[.14em] text-muted"></span>
                <button id="suivant" class="min-h-12 px-5 font-title font-bold text-[.85rem] tracking-widest rounded-xs border border-goldtext-gold transition hover:text-bg disabled:opacity-40 disabled:cursor-not-allowed">Suivant ▶</button>
            </div>
        </div>
    </section>
  </main>
  <dialog id="detail" class="m-auto w-[90vw] max-w-sm bg-transparent p-0 text-text backdrop:bg-black/75"></dialog>
  <script src="packs.js" defer></script>
  <script src="cards.js" defer></script>
  <script src="grimoire.js" defer></script>


</body>
